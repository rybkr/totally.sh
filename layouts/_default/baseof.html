<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.Params.description }}">
    <meta name="color-scheme" content="dark">
    <title>{{ if .IsHome }}{{ site.Title }} — know what your agents cost{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
    <script src="{{ "js/terminal-demo.js" | relURL }}" defer></script>
    <script src="{{ "js/navigation.js" | relURL }}" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="wordmark" href="{{ site.Home.RelPermalink }}" aria-label="Totally home">totally_</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-navigation">
          <span class="sr-only">Toggle navigation</span>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <nav id="main-navigation" aria-label="Main navigation">
          {{ range site.Menus.main }}
            {{ if eq .Name "GitHub" }}
              <a class="source-link github-link" href="{{ .URL }}" aria-label="Totally on GitHub">
                <img src="{{ "img/github-invertocat.svg" | relURL }}" alt="">
              </a>
            {{ else }}
              <a href="{{ .URL }}">{{ .Name }}</a>
            {{ end }}
          {{ end }}
        </nav>
      </div>
    </header>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer>
      <div class="container">
        <span>totally_</span>
        <span>Open under the <a class="license-link" href="https://github.com/rybkr/totally?tab=MIT-1-ov-file#">MIT License</a></span>
        <a class="footer-github-link" href="https://github.com/rybkr/totally" aria-label="Totally on GitHub">
          <img src="{{ "img/github-invertocat.svg" | relURL }}" alt="">
        </a>
      </div>
    </footer>
  </body>
</html>
